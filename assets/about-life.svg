<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" fill="none">
  <defs>
    <style>
      .about-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .about-mono {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }

      /* Carousel Progress Bar Animations (12s cycle: 4s each) */
      @keyframes prog1 {
        0% { width: 0%; }
        30%, 100% { width: 100%; }
      }
      @keyframes prog2 {
        0%, 33.3% { width: 0%; }
        63.3%, 100% { width: 100%; }
      }
      @keyframes prog3 {
        0%, 66.6% { width: 0%; }
        96.6%, 100% { width: 100%; }
      }

      /* Carousel Slide Transitions */
      @keyframes slide1 {
        0%, 30% { opacity: 1; transform: translateX(0); }
        33.3%, 97% { opacity: 0; transform: translateX(18px); pointer-events: none; }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slide2 {
        0%, 30% { opacity: 0; transform: translateX(-18px); pointer-events: none; }
        33.3%, 63.3% { opacity: 1; transform: translateX(0); }
        66.6%, 100% { opacity: 0; transform: translateX(18px); pointer-events: none; }
      }
      @keyframes slide3 {
        0%, 63.3% { opacity: 0; transform: translateX(-18px); pointer-events: none; }
        66.6%, 96.6% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(18px); pointer-events: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>

    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>

    <linearGradient id="about-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e192f"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <linearGradient id="about-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1b253b"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="about-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#247bff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="about-main-clip">
      <rect x="0" y="0" width="880" height="360" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#about-main-clip)">
    <!-- Main Background -->
    <rect width="880" height="360" fill="url(#about-bg-grad)"/>
    <rect width="880" height="360" fill="url(#about-grid)"/>

    <!-- Section Header Tag -->
    <g transform="translate(42, 28)">
      <rect x="0" y="0" width="165" height="24" rx="6" fill="#0e1a30" stroke="#247bff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="16" fill="#58a6ff" class="about-mono" font-size="10.5" font-weight="700" letter-spacing="1">02 // CAPABILITIES &amp; LIFE</text>
      <text x="185" y="17" fill="#8b949e" class="about-font" font-size="13">What drives my technical craftsmanship and daily curiosity</text>
    </g>

    <!-- LEFT CARD: CAPABILITIES -->
    <g transform="translate(42, 68)">
      <rect width="386" height="260" rx="14" fill="url(#about-card-grad)" stroke="#1a2742" stroke-width="1.2"/>
      
      <!-- Card Title -->
      <text x="22" y="32" fill="#ffffff" class="about-font" font-size="15.5" font-weight="800" letter-spacing="0.5">CORE CAPABILITIES</text>
      <text x="320" y="32" fill="#247bff" class="about-mono" font-size="11.5" font-weight="700">SPEC</text>
      <line x1="22" y1="44" x2="364" y2="44" stroke="#16233b" stroke-width="1"/>

      <!-- Capability 1 -->
      <g transform="translate(22, 58)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#13233f" stroke="#247bff" stroke-opacity="0.5"/>
        <path d="M12 17C12 14.2 14.2 12 17 12C19.8 12 22 14.2 22 17C22 19.8 19.8 22 17 22" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="17" cy="17" r="2" fill="#00ff88"/>
        <text x="46" y="15" fill="#f0f6fc" class="about-font" font-size="13" font-weight="700">Applied AI &amp; Machine Learning</text>
        <text x="46" y="31" fill="#8b949e" class="about-font" font-size="11">TensorFlow, Scikit-learn, Neural Nets &amp; Vision</text>
      </g>

      <!-- Capability 2 -->
      <g transform="translate(22, 122)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#241424" stroke="#ff354f" stroke-opacity="0.5"/>
        <path d="M11 14L17 10L23 14L17 18L11 14ZM11 20L17 24L23 20" stroke="#ff354f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="15" fill="#f0f6fc" class="about-font" font-size="13" font-weight="700">Full-Stack Architecture</text>
        <text x="46" y="31" fill="#8b949e" class="about-font" font-size="11">React, Node.js, REST APIs, High Performance</text>
      </g>

      <!-- Capability 3 -->
      <g transform="translate(22, 186)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#0f262a" stroke="#00ff88" stroke-opacity="0.5"/>
        <path d="M17 10V24M10 17H24" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="15" fill="#f0f6fc" class="about-font" font-size="13" font-weight="700">Systems, Algorithms &amp; C++</text>
        <text x="46" y="31" fill="#8b949e" class="about-font" font-size="11">Low-level efficiency, Clean Code &amp; Git ELT</text>
      </g>
    </g>

    <!-- RIGHT CARD: 3-SLIDE INTERESTS CAROUSEL -->
    <g transform="translate(452, 68)">
      <rect width="386" height="260" rx="14" fill="url(#about-card-grad)" stroke="#1a2742" stroke-width="1.2"/>
      
      <!-- Card Title -->
      <text x="22" y="32" fill="#ffffff" class="about-font" font-size="15.5" font-weight="800" letter-spacing="0.5">INTERESTS &amp; PASSIONS</text>
      
      <!-- Segment Progress Indicators (3 Bars) -->
      <g transform="translate(22, 46)">
        <!-- Seg 1 -->
        <rect x="0" y="0" width="108" height="4" rx="2" fill="#1a2744"/>
        <rect x="0" y="0" height="4" rx="2" fill="#247bff" style="animation: prog1 12s infinite linear;"/>

        <!-- Seg 2 -->
        <rect x="118" y="0" width="108" height="4" rx="2" fill="#1a2744"/>
        <rect x="118" y="0" height="4" rx="2" fill="#ff354f" style="animation: prog2 12s infinite linear;"/>

        <!-- Seg 3 -->
        <rect x="236" y="0" width="108" height="4" rx="2" fill="#1a2744"/>
        <rect x="236" y="0" height="4" rx="2" fill="#00ff88" style="animation: prog3 12s infinite linear;"/>
      </g>

      <!-- SLIDE 1: AI & ML -->
      <g transform="translate(22, 68)" style="animation: slide1 12s infinite cubic-bezier(0.4, 0, 0.2, 1);">
        <g transform="translate(0, 8)">
          <rect x="0" y="0" width="76" height="22" rx="4" fill="#13233f"/>
          <text x="8" y="15" fill="#58a6ff" class="about-mono" font-size="10" font-weight="700">01 / PASSION</text>
          <text x="0" y="48" fill="#ffffff" class="about-font" font-size="19" font-weight="800">AI &amp; Machine Learning</text>
          <text x="0" y="74" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            Fascinated by neural networks, predictive intelligence,
          </text>
          <text x="0" y="94" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            and transforming raw data into actionable decision systems.
          </text>

          <g transform="translate(0, 118)">
            <rect x="0" y="0" width="342" height="34" rx="6" fill="#070c18" stroke="#1f2d48" stroke-width="1"/>
            <text x="12" y="21" fill="#58a6ff" class="about-mono" font-size="10.5">FOCUS: Deep Learning · Computer Vision · NLP</text>
          </g>
        </g>
      </g>

      <!-- SLIDE 2: CAR RACING -->
      <g transform="translate(22, 68)" style="animation: slide2 12s infinite cubic-bezier(0.4, 0, 0.2, 1);">
        <g transform="translate(0, 8)">
          <rect x="0" y="0" width="76" height="22" rx="4" fill="#29121a"/>
          <text x="8" y="15" fill="#ff4d6a" class="about-mono" font-size="10" font-weight="700">02 / ADRENALINE</text>
          <text x="0" y="48" fill="#ffffff" class="about-font" font-size="19" font-weight="800">Car Racing &amp; Dynamics</text>
          <text x="0" y="74" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            The thrill of high-speed aerodynamics, apex precision,
          </text>
          <text x="0" y="94" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            and high-stakes split-second decision making under pressure.
          </text>

          <g transform="translate(0, 118)">
            <rect x="0" y="0" width="342" height="34" rx="6" fill="#070c18" stroke="#1f2d48" stroke-width="1"/>
            <text x="12" y="21" fill="#ff4d6a" class="about-mono" font-size="10.5">ETHOS: Speed · Telemetry · Peak Precision</text>
          </g>
        </g>
      </g>

      <!-- SLIDE 3: ENTREPRENEURSHIP -->
      <g transform="translate(22, 68)" style="animation: slide3 12s infinite cubic-bezier(0.4, 0, 0.2, 1);">
        <g transform="translate(0, 8)">
          <rect x="0" y="0" width="76" height="22" rx="4" fill="#0c231e"/>
          <text x="8" y="15" fill="#00ff88" class="about-mono" font-size="10" font-weight="700">03 / VENTURES</text>
          <text x="0" y="48" fill="#ffffff" class="about-font" font-size="19" font-weight="800">Entrepreneurship &amp; Building</text>
          <text x="0" y="74" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            Founder of Ryth (200+ active users). Building products
          </text>
          <text x="0" y="94" fill="#a0aec0" class="about-font" font-size="12.5" font-weight="400">
            that blend user growth, smart content and intuitive design.
          </text>

          <g transform="translate(0, 118)">
            <rect x="0" y="0" width="342" height="34" rx="6" fill="#070c18" stroke="#1f2d48" stroke-width="1"/>
            <text x="12" y="21" fill="#00ff88" class="about-mono" font-size="10.5">VENTURE: Ryth Platform · Growth &amp; Tech</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="878" height="358" rx="15" fill="none" stroke="url(#about-border-grad)" stroke-width="1.5"/>
  </g>
</svg>